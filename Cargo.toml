[workspace]
resolver = "2"
members = ["crates/sh-core", "crates/sh-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff"] }
# natord: natural sort (img2 < img10) matching Explorer order, used by core::navigation.
# Evaluated: v1.0.9, zero dependencies, MIT license, single-file crate (~200 LOC),
# total-order tests; old but tiny, stable and fully auditable — accepted on the merits.
natord = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
proptest = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
