name: Publish GitHub Release

# A release must correspond to an immutable, named ref. There is deliberately
# no `branches` filter and no `workflow_dispatch`: a manual run would attach a
# Release to a tag that nothing was gated against, which is exactly the failure
# the version gate below exists to prevent.
on:
  push:
    tags:
      - 'v*'

# Narrowest scope that can still create a Release. Not `packages:`, not
# `pull-requests:`, not `write-all`: this job needs to write exactly one thing.
permissions:
  contents: write

# Keyed on the ref and never cancelled. A release run publishes a version, so
# reruns queue behind the run in flight instead of killing a job halfway through
# an install smoke test and leaving a half-published tag.
concurrency:
  group: publish-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Same pin and same rationale as release.yml: keeping the installer compiler
  # identical means a tagged rebuild is byte-comparable with the run that proved
  # the packaging. Bump both workflows together.
  INNO_SETUP_VERSION: 6.7.1
  # Chocolatey installs Inno Setup machine-wide, so ISCC.exe lands in the 32-bit
  # program directory even though the setup itself runs in 64-bit install mode.
  # Always invoke it by full path: the runner has no other ISCC on PATH and a
  # relative `iscc` would silently not resolve.
  ISCC: C:\Program Files (x86)\Inno Setup 6\ISCC.exe

jobs:
  publish:
    name: Publish tagged release
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # THE GATE. Deliberately the first step after the checkout: a mistagged
      # release must cost seconds, not a full toolchain install and compile.
      #
      # The tag is the release identity. It is what a user downloads, what the
      # Release is attached to, and what they compare against months later.
      # [workspace.package] version in Cargo.toml is the version source of truth:
      # it is what actually gets compiled into the binary and stamped into the
      # installer. If the two can disagree, a user can be handed a build that is
      # not the one the tag names, and "am I running the version with the fix?"
      # stops being answerable at all. Fail the job instead of publishing that.
      - name: Verify tag matches the Cargo version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The pushed tag itself, e.g. 'v0.1.0'.
          $tag = $env:GITHUB_REF_NAME
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw 'GITHUB_REF_NAME is empty; this workflow must be triggered by a tag push'
          }

          # Same parse as release.yml, kept identical on purpose: the two
          # workflows must never disagree about what the current version is.
          $cargo = Get-Content -Raw -LiteralPath 'Cargo.toml'
          $section = [regex]::Match($cargo, '(?ms)^\[workspace\.package\][ \t]*(?<body>.*?)(?=^\[|\z)')
          if (-not $section.Success) { throw 'Cargo.toml has no [workspace.package] section' }
          $m = [regex]::Match($section.Groups['body'].Value, '(?m)^[ \t]*version[ \t]*=[ \t]*"(?<v>[^"]+)"')
          if (-not $m.Success) { throw 'Could not parse [workspace.package].version from Cargo.toml' }
          $cargoVersion = $m.Groups['v'].Value

          $tagVersion = $tag.TrimStart('v')
          if ($tagVersion -ne $cargoVersion) {
            throw ("Tag '$tag' resolves to version '$tagVersion', which does not match " +
              "[workspace.package] version '$cargoVersion' in Cargo.toml. The tag and the Cargo " +
              "version are two sources of truth and they must agree: the tag names the release, " +
              "and '$cargoVersion' is what was actually built. To publish, either set " +
              "[workspace.package] version to '$tagVersion' in Cargo.toml and commit that, or " +
              "retag the commit that already carries it.")
          }

          # Everything downstream names files after this version, exactly as
          # release.yml does.
          "APP_VERSION=$cargoVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # Release assets are staged in the runner's temporary directory, not in
          # the checkout: nothing survives the run, and the durable copy is the
          # Release asset rather than a file left behind in the workspace.
          "DIST_DIR=$env:RUNNER_TEMP\sh-images-release-dist" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Tag '$tag' matches Cargo version '$cargoVersion'"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      # THE single release build, and the only one in this workflow. Both the
      # portable ZIP and the installer consume the executable produced here, so
      # the published assets can never disagree about which sh-app.exe they ship.
      - name: Build release binary
        run: cargo build --release -p sh-app
        timeout-minutes: 45

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'target\release\sh-app.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Release binary missing at $exe - the build step did not produce it"
          }
          $dist = $env:DIST_DIR
          $stage = Join-Path $env:RUNNER_TEMP 'portable-stage'
          New-Item -ItemType Directory -Force -Path $dist, $stage | Out-Null
          Copy-Item -LiteralPath $exe -Destination $stage
          # LICENSE ships with the portable build so the MIT terms travel with
          # the binary, matching what the installer does.
          Copy-Item -LiteralPath 'LICENSE' -Destination $stage
          $zip = Join-Path $dist "ShImages-$env:APP_VERSION-win-x64.zip"
          # Explicit enumeration, and -Force, because Compress-Archive FILTERS
          # OUT files carrying the Hidden attribute. A glob hides the same files.
          # The installer reads LICENSE directly, so if a checkout ever marks it
          # Hidden the ZIP would ship without the MIT text while the installer
          # shipped with it - a silent license gap with no error anywhere.
          # Enumerating with -Force makes a hidden file fail the job instead.
          $staged = Get-ChildItem -LiteralPath $stage -Force | ForEach-Object { $_.FullName }
          Compress-Archive -Path $staged -DestinationPath $zip -Force
          "Created $zip ({0} bytes)" -f (Get-Item -LiteralPath $zip).Length

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innoSetup --version=$env:INNO_SETUP_VERSION -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath $env:ISCC)) {
            throw "ISCC.exe not found at '$env:ISCC' - the Chocolatey install did not land where expected"
          }
          & $env:ISCC 'installer\sh-images.iss' "/DAppVersion=$env:APP_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          $setup = "target\installer\ShImages-Setup-$env:APP_VERSION-win-x64.exe"
          if (-not (Test-Path -LiteralPath $setup)) {
            throw "ISCC reported success but produced no installer at $setup"
          }
          $dist = $env:DIST_DIR
          Copy-Item -LiteralPath $setup -Destination $dist
          "Compiled {0} ({1} bytes)" -f $setup, (Get-Item -LiteralPath $setup).Length

      # End-to-end proof that the installer actually installs and uninstalls.
      # /DIR= is mandatory: the .iss default is {localappdata}\Programs\Sh
      # Images, and a runner must never write to a real user install path.
      - name: Smoke test silent install and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path -LiteralPath (Join-Path $env:DIST_DIR "ShImages-Setup-$env:APP_VERSION-win-x64.exe")).Path
          $dir = Join-Path $env:RUNNER_TEMP 'sh-images-install-smoke'
          if (Test-Path -LiteralPath $dir) { Remove-Item -Recurse -Force -LiteralPath $dir }

          # The quotes around the value are required: Start-Process -ArgumentList
          # joins the array with spaces and adds none, so an unquoted /DIR= with
          # a space in the path arrives as separate tokens.
          $install = Start-Process -FilePath $setup `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$dir`"" `
            -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent install failed with exit code $($install.ExitCode)" }

          $exe = Join-Path $dir 'sh-app.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Installed executable missing at $exe - the installer did not lay down the payload"
          }
          # Payload assertion only. Inno writes unins000.exe whenever
          # Uninstallable=yes; it says nothing about the Add/Remove Programs
          # entry, so the registry key below is what actually guards
          # CreateUninstallRegKey.
          $unins = Join-Path $dir 'unins000.exe'
          if (-not (Test-Path -LiteralPath $unins)) {
            throw "Uninstaller missing at $unins - Uninstallable=yes did not run"
          }
          # PrivilegesRequired=lowest is why this lands under HKEY_CURRENT_USER
          # rather than HKEY_LOCAL_MACHINE. Inno appends the _is1 suffix.
          $appId = '2ABBD0F1-2CF2-4B42-A948-3E35666D70AD'
          $uninstallKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\${appId}_is1"
          if (-not (Test-Path -LiteralPath $uninstallKey)) {
            throw "Add/Remove Programs entry missing at $uninstallKey - CreateUninstallRegKey=yes did not run"
          }

          $uninstall = Start-Process -FilePath $unins `
            -ArgumentList '/VERYSILENT', '/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Silent uninstall failed with exit code $($uninstall.ExitCode)" }

          # unins000.exe re-launches itself from a temp copy and can return before
          # that copy finishes removing the directory, so poll instead of
          # checking once and reporting a false failure.
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path -LiteralPath $dir) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 500
          }
          if (Test-Path -LiteralPath $dir) {
            $left = (Get-ChildItem -Recurse -Force -LiteralPath $dir | Select-Object -ExpandProperty FullName) -join ', '
            throw "Uninstall left the install directory behind: $dir (residual: $left)"
          }
          # After the poll, not before: the uninstaller removes the key as part of
          # finishing, so asserting earlier would race the same temp copy.
          if (Test-Path -LiteralPath $uninstallKey) {
            throw "Uninstall left the Add/Remove Programs entry behind: $uninstallKey"
          }
          "Silent install and uninstall verified in $dir"

      # Computed last so it covers every published file. A checksum file cannot
      # contain its own hash, so SHA256SUMS.txt is itself excluded.
      - name: Compute SHA256SUMS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = $env:DIST_DIR
          $files = @(
            "ShImages-$env:APP_VERSION-win-x64.zip"
            "ShImages-Setup-$env:APP_VERSION-win-x64.exe"
          )
          # GNU coreutils text format ("<hash>  <name>", two spaces) so
          # `sha256sum -c SHA256SUMS.txt` verifies on Linux, macOS and Git Bash.
          $lines = foreach ($name in $files) {
            $full = Join-Path $dist $name
            if (-not (Test-Path -LiteralPath $full)) { throw "Published file missing: $full" }
            '{0}  {1}' -f (Get-FileHash -LiteralPath $full -Algorithm SHA256).Hash.ToLowerInvariant(), $name
          }
          $out = Join-Path $dist 'SHA256SUMS.txt'
          $lines | Set-Content -LiteralPath $out -Encoding ascii
          Get-Content -LiteralPath $out

      # The durable copy. Actions artifacts are per-run, need a login and expire,
      # so they are not a download surface. The Release asset is. No
      # upload-artifact here on purpose: one durable copy, and therefore no second
      # place for the two copies to disagree. Nothing is signed, and the release
      # is published live rather than as a draft or a prerelease.
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME

          # Same discipline as if-no-files-found: error in release.yml: a
          # packaging regression has to fail the job, not publish a Release with
          # a silently empty asset set. The names are the single source of truth
          # for both this assertion and the attach list below.
          $assets = @(
            "ShImages-$env:APP_VERSION-win-x64.zip"
            "ShImages-Setup-$env:APP_VERSION-win-x64.exe"
            "SHA256SUMS.txt"
          )
          $paths = @($assets | ForEach-Object { Join-Path $env:DIST_DIR $_ })
          $missing = @($paths | Where-Object { -not (Test-Path -LiteralPath $_) })
          if ($missing.Count -gt 0) {
            throw ("Refusing to publish: $($missing.Count) expected release asset(s) missing: " +
              "$($missing -join ', ')")
          }
          foreach ($path in $paths) {
            "asset: {0} ({1} bytes)" -f (Split-Path $path -Leaf), (Get-Item -LiteralPath $path).Length
          }

          # The license name is read from the checked-out LICENSE rather than
          # hardcoded in these notes, so the Release cannot claim a license the
          # repository does not ship. The full text travels with the software: it
          # is inside the portable ZIP and installed by the installer.
          if (-not (Test-Path -LiteralPath 'LICENSE')) {
            throw 'LICENSE missing at the repository root'
          }
          $license = ((Get-Content -LiteralPath 'LICENSE' -TotalCount 1).Trim() -replace '\s+License$', '')
          $repo = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY"

          # Single-quoted here-string: the notes are Markdown, so backticks are
          # literal text here and must not be read as PowerShell escapes. The
          # placeholders below are substituted afterwards.
          $notes = @'
          Sh Images __TAG__ for Windows x64.

          ## What is attached

          - `ShImages-__VERSION__-win-x64.zip` - the portable build. Unpack it anywhere and run
            `sh-app.exe`; nothing is installed and nothing is written outside that folder.
          - `ShImages-Setup-__VERSION__-win-x64.exe` - the installer. It installs per user, needs
            no administrator rights and no UAC prompt, and creates an Add/Remove Programs entry so
            the application can be removed later.
          - `SHA256SUMS.txt` - SHA-256 checksums for the ZIP and the installer.

          ## Windows SmartScreen will warn you

          The installer for this release is UNSIGNED, so Windows SmartScreen shows an
          "Unknown publisher" warning the first time it runs. That is expected for this release.
          Either verify the download against the checksums below before running it, or continue
          through More info and Run anyway.

          ## Upgrading

          There is no in-app updater. To upgrade, download the new installer and run it over the
          existing installation. Settings and custom themes are stored in %APPDATA%\sh_images,
          outside the install directory, so they are preserved by an upgrade.

          ## Verifying the downloads

          Download all three files into the same folder first: the checksum file records bare
          file names, so `sha256sum -c` expects to find them next to it.

          - Linux, macOS or Git Bash: `sha256sum -c SHA256SUMS.txt`
          - Windows PowerShell: compare
            `(Get-FileHash .\ShImages-__VERSION__-win-x64.zip -Algorithm SHA256).Hash` with the
            value recorded for that file in `SHA256SUMS.txt`.

          ## License and source

          Sh Images is open source and released under the __LICENSE__ License. The full license
          text ships inside the portable ZIP and is installed alongside the application. Source
          code and issue tracker: __REPO__.
          '@
          $notes = $notes.Replace('__TAG__', $tag).
            Replace('__VERSION__', $env:APP_VERSION).
            Replace('__LICENSE__', $license).
            Replace('__REPO__', $repo)
          $notesFile = Join-Path $env:RUNNER_TEMP 'sh-images-release-notes.md'
          Set-Content -LiteralPath $notesFile -Value $notes -Encoding utf8

          gh release create "$tag" `
            --verify-tag `
            --title "Sh Images $tag" `
            --notes-file "$notesFile" `
            --repo "$env:GITHUB_REPOSITORY" `
            @paths
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
