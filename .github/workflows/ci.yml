name: Windows Quality Gates

# Every third-party action below is pinned to a full commit SHA, never a tag.
# A tag like `@v7` is a mutable pointer: whoever controls that repository can
# repoint it, and this workflow would then execute their new code with this
# repository's `GITHUB_TOKEN` and, on a release path, publish artifacts. On a
# public repository that is a live supply-chain surface, and the tag gives an
# attacker a version that looks legitimate in review.
#
# The trailing `# v7` comment is the convention Dependabot reads, so the
# automatic security updates keep working: it updates the SHA and the comment
# together. To bump one deliberately, resolve the tag to a SHA first --
#   gh api repos/actions/checkout/commits/v7 --jq .sha
# and update all three workflows together, since they share these pins.
#
# `dtolnay/rust-toolchain@stable` is a branch, not a tag, and pinning it is
# even more important: an unpinned branch resolves to whatever that branch
# points at on every single run.

on:
  push:
    branches:
      - main
    # Historical basis, kept for the record: in a 3-day audit, 8 of 69 runs
    # were documentation-only and cost ~114 of ~1090 elapsed minutes (~10%),
    # with a median of 18.1 min/run on windows-latest (a 2x billing
    # multiplier). That measurement is why this filter exists, but it is no
    # longer a reason to keep it: Actions minutes are free on a public
    # repository, so skipping these runs now saves nothing.
    #
    # What actually keeps this filter here, and ONLY here, is that it is safe
    # on the push trigger. A required status check is evaluated against the
    # pull request head, before any merge push exists, so a push-side filter
    # can never withhold a check that a merge decision depends on. The
    # identical filter on `pull_request` is a guaranteed deadlock and has been
    # removed; read the comment there before copying this one across.
    #
    # DO NOT extend this list without the same reasoning:
    # `installer/sh-images.iss` lives under installer/, not docs/, and is
    # compiled by the installer-script job, so an edit to it must still run
    # both jobs here.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
      - 'docs/**'
  pull_request:
    branches:
      - main
      # The chain branches are added for the gpui-component Feature Branch
      # Chain. Every child PR's base is the previous child's branch, not
      # `main`, so with `main` alone this workflow never fired for any of
      # them: eleven pull requests sat CLEAN with zero checks, and the only
      # run happened on the tracker, which tests the accumulated result. A
      # defect introduced in child 3 would therefore surface at the tracker
      # merge instead of at child 3, which is where the bisect belongs.
      #
      # This is purely additive and cannot deadlock anything. A required
      # status check is evaluated against the pull request head, and the only
      # pull request that targets `main` is the tracker, so the required
      # checks `Windows quality gates` and `Installer script validation` keep
      # exactly the meaning they had. `push` is untouched, and no
      # `paths-ignore` is introduced here - see the note below on why adding
      # one to this trigger is a guaranteed deadlock.
      - 'chain/**'
      - 'feature/**'
    # NO `paths-ignore` HERE, DELIBERATELY, while `push` above still has one.
    #
    # Reason: `main` requires the status checks `Windows quality gates` and
    # `Installer script validation`. GitHub evaluates a required check against
    # the pull request's head commit, and a workflow that is skipped for a
    # commit emits no check run for it at all. A documentation-only pull
    # request (README.md, LICENSE, NOTICE, docs/**) would therefore produce no
    # `Windows quality gates` run, the required check would never report, and
    # the pull request could never be merged - a permanent deadlock on every
    # future documentation change. Re-adding this filter re-creates that
    # deadlock. Do not.
    #
    # The filter on `push: branches: [main]` is safe and stays, because a
    # required status check is never evaluated against a post-merge push:
    # GitHub decides mergeability from the pull request head, before the merge
    # push exists. Skipping the run after the merge changes no merge decision.
    #
    # The cost argument that originally justified this filter no longer holds.
    # Actions minutes are free on a public repository, so a documentation-only
    # pull request now costs nothing to verify, and that removes the only
    # remaining reason to skip it here.
    # PR metadata edits emit `edited`; base-only API retargets may not, so synchronize the branch or refresh PR metadata when needed.
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

concurrency:
  group: windows-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Windows quality gates
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The toolchain step below installs the toolchain and nothing else, so
      # before this change every run started from a cold Windows VM and
      # recompiled the whole Cargo dependency graph from scratch. The audit
      # behind this file measured 69 runs / ~1090 elapsed minutes / 18.1 min
      # median, all on windows-latest (2x billing), with no build caching
      # anywhere. The cache step below is the attempt to fix that; whether it
      # actually pays off is not yet measured, so read its comment before
      # defending it.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # MEASURED - a warm restore cuts the gates from 22m22s to 5m38s (~4x).
      # Run 36271953612 (main, cold) missed and uploaded a 981,053,390-byte
      # archive: 22m22s, Clippy 431s, tests 701s. Run 36276142958 (this
      # branch, warm) hit that exact entry - 5m38s, Clippy 75s, tests 64s,
      # restore 2m00.09s (0.50s lookup, 13.42s download at 71.0 MB/s, 1m45.83s
      # tar+zstd extraction), save 0.80s. The cache is a proven saving; do not
      # remove it.
      #
      # Two facts to carry forward. The FIRST run on a changed dependency state
      # is a miss and pays the upload, so judge a change on the second run,
      # never the first. And `add-job-id-key: false` is what makes the key
      # deterministic - both runs above computed the identical
      # `v0-rust-Windows_NT-x64-2113753f-80b8f0c1` - which is what lets a
      # pull-request run hit a cache populated by a `main` run. Re-enabling it
      # re-breaks that sharing; see the note below for why it is safe to leave
      # off.
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # `add-job-id-key` defaults to true, which embeds a per-job id in
          # the cache key - the trailing `2113753f-80b8f0c1` in the key
          # recorded above. That makes every run compute a DIFFERENT key, so
          # every run uploads its own ~936 MiB archive and then misses on
          # restore. Against GitHub's 10 GB per-repository cache limit that is
          # self-eviction: only ~10 archives fit, and 7-day eviction clears
          # them anyway, so the cache would never hit.
          #
          # The input exists to prevent two jobs from concurrently writing the
          # same key. That risk does not apply here. GitHub caches are
          # immutable - first writer wins and later writes are silently
          # dropped, so a collision cannot corrupt an entry - and there is no
          # second writer to collide with in the first place: only the
          # `quality` job compiles Rust. `installer-script` runs no Cargo
          # command at all, it only writes a stub payload and invokes ISCC.
          add-job-id-key: false

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  # Fast gate: catch installer script breakage (typo'd directive, bad {cm:}
  # constant, missing [Files] source) on the PR, where it is cheap, instead of
  # discovering it in the release run. Deliberately does NOT build the app and
  # does NOT publish anything - the real end-to-end install/uninstall test runs
  # in release.yml, on manual dispatch.
  installer-script:
    name: Installer script validation
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Inno's compiler resolves and compresses every [Files] Source: at compile
      # time, so a missing payload is a hard error even though this job never
      # builds the application. Create the expected path as an explicit stub so
      # ISCC can validate the script. This file is written by the job, never
      # committed, and target/ is git-ignored, so it cannot leak into a diff.
      # The payload is validated for real by the release workflow, which runs a
      # full silent install and uninstall against the actual compiled binary.
      - name: Create stub payload for the syntax check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = 'target\release\sh-app.exe'
          New-Item -ItemType Directory -Force -Path (Split-Path $payload) | Out-Null
          Set-Content -LiteralPath $payload -Value 'stub payload for ISCC syntax validation only' -NoNewline
          "Created stub $payload ({0} bytes)" -f (Get-Item -LiteralPath $payload).Length

      # Same pin as release.yml, which is the source of truth for it. Bump both
      # together; there is no shared composite action for a two-line pin.
      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innoSetup --version=6.7.1 -y --no-progress

      - name: Compile installer script
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "ISCC.exe not found at '$iscc' - the Chocolatey install did not land where expected"
          }
          # Same version the release build will use, read from the same place.
          $cargo = Get-Content -Raw -LiteralPath 'Cargo.toml'
          $section = [regex]::Match($cargo, '(?ms)^\[workspace\.package\][ \t]*(?<body>.*?)(?=^\[|\z)')
          if (-not $section.Success) { throw 'Cargo.toml has no [workspace.package] section' }
          $m = [regex]::Match($section.Groups['body'].Value, '(?m)^[ \t]*version[ \t]*=[ \t]*"(?<v>[^"]+)"')
          if (-not $m.Success) { throw 'Could not parse [workspace.package].version from Cargo.toml' }
          $version = $m.Groups['v'].Value

          & $iscc 'installer\sh-images.iss' "/DAppVersion=$version"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          $setup = "target\installer\ShImages-Setup-$version-win-x64.exe"
          if (-not (Test-Path -LiteralPath $setup)) {
            throw "ISCC reported success but produced no installer at $setup"
          }
          "installer/sh-images.iss compiled cleanly for version $version"
