name: Windows Quality Gates

on:
  push:
    branches:
      - main
    # Measured saving, so this is not "optimized away" later: in a 3-day
    # audit, 8 of 69 runs were documentation-only and cost ~114 of ~1090
    # elapsed minutes (~10%), with a median of 18.1 min/run on windows-latest
    # (a 2x billing multiplier). None of these paths can change compiled
    # behaviour, the Cargo dependency graph, or the Inno Setup script, so
    # running the gates for them is pure waste. DO NOT extend this list
    # without the same reasoning: `installer/sh-images.iss` lives under
    # installer/, not docs/, and is compiled by the installer-script job, so
    # an edit to it must still run both jobs here.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
      - 'docs/**'
  pull_request:
    branches:
      - main
    # Same filter as the push trigger above, and applied here for the same
    # reason. `main` has no required status checks (it reports
    # protected: false and branch protection is unavailable on this repo's
    # plan), so a documentation-only PR producing no check cannot deadlock
    # the merge button. If branch protection ever gains a required
    # `Windows quality gates` check, DELETE the `paths-ignore` below first:
    # an ignored path means the check never reports, and a required check
    # that never reports blocks the PR forever.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
      - 'docs/**'
    # PR metadata edits emit `edited`; base-only API retargets may not, so synchronize the branch or refresh PR metadata when needed.
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

concurrency:
  group: windows-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Windows quality gates
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The toolchain step below installs the toolchain and nothing else, so
      # before this change every run started from a cold Windows VM and
      # recompiled the whole Cargo dependency graph from scratch. The audit
      # behind this file measured 69 runs / ~1090 elapsed minutes / 18.1 min
      # median, all on windows-latest (2x billing), with no build caching
      # anywhere. The cache step below is the attempt to fix that; whether it
      # actually pays off is not yet measured, so read its comment before
      # defending it.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # MEASURED - a warm restore cuts the gates from 22m22s to 5m38s (~4x).
      # Run 36271953612 (main, cold) missed and uploaded a 981,053,390-byte
      # archive: 22m22s, Clippy 431s, tests 701s. Run 36276142958 (this
      # branch, warm) hit that exact entry - 5m38s, Clippy 75s, tests 64s,
      # restore 2m00.09s (0.50s lookup, 13.42s download at 71.0 MB/s, 1m45.83s
      # tar+zstd extraction), save 0.80s. The cache is a proven saving; do not
      # remove it.
      #
      # Two facts to carry forward. The FIRST run on a changed dependency state
      # is a miss and pays the upload, so judge a change on the second run,
      # never the first. And `add-job-id-key: false` is what makes the key
      # deterministic - both runs above computed the identical
      # `v0-rust-Windows_NT-x64-2113753f-80b8f0c1` - which is what lets a
      # pull-request run hit a cache populated by a `main` run. Re-enabling it
      # re-breaks that sharing; see the note below for why it is safe to leave
      # off.
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          # `add-job-id-key` defaults to true, which embeds a per-job id in
          # the cache key - the trailing `2113753f-80b8f0c1` in the key
          # recorded above. That makes every run compute a DIFFERENT key, so
          # every run uploads its own ~936 MiB archive and then misses on
          # restore. Against GitHub's 10 GB per-repository cache limit that is
          # self-eviction: only ~10 archives fit, and 7-day eviction clears
          # them anyway, so the cache would never hit.
          #
          # The input exists to prevent two jobs from concurrently writing the
          # same key. That risk does not apply here. GitHub caches are
          # immutable - first writer wins and later writes are silently
          # dropped, so a collision cannot corrupt an entry - and there is no
          # second writer to collide with in the first place: only the
          # `quality` job compiles Rust. `installer-script` runs no Cargo
          # command at all, it only writes a stub payload and invokes ISCC.
          add-job-id-key: false

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  # Fast gate: catch installer script breakage (typo'd directive, bad {cm:}
  # constant, missing [Files] source) on the PR, where it is cheap, instead of
  # discovering it in the release run. Deliberately does NOT build the app and
  # does NOT publish anything - the real end-to-end install/uninstall test runs
  # in release.yml, on manual dispatch.
  installer-script:
    name: Installer script validation
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Inno's compiler resolves and compresses every [Files] Source: at compile
      # time, so a missing payload is a hard error even though this job never
      # builds the application. Create the expected path as an explicit stub so
      # ISCC can validate the script. This file is written by the job, never
      # committed, and target/ is git-ignored, so it cannot leak into a diff.
      # The payload is validated for real by the release workflow, which runs a
      # full silent install and uninstall against the actual compiled binary.
      - name: Create stub payload for the syntax check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = 'target\release\sh-app.exe'
          New-Item -ItemType Directory -Force -Path (Split-Path $payload) | Out-Null
          Set-Content -LiteralPath $payload -Value 'stub payload for ISCC syntax validation only' -NoNewline
          "Created stub $payload ({0} bytes)" -f (Get-Item -LiteralPath $payload).Length

      # Same pin as release.yml, which is the source of truth for it. Bump both
      # together; there is no shared composite action for a two-line pin.
      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innoSetup --version=6.7.1 -y --no-progress

      - name: Compile installer script
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "ISCC.exe not found at '$iscc' - the Chocolatey install did not land where expected"
          }
          # Same version the release build will use, read from the same place.
          $cargo = Get-Content -Raw -LiteralPath 'Cargo.toml'
          $section = [regex]::Match($cargo, '(?ms)^\[workspace\.package\][ \t]*(?<body>.*?)(?=^\[|\z)')
          if (-not $section.Success) { throw 'Cargo.toml has no [workspace.package] section' }
          $m = [regex]::Match($section.Groups['body'].Value, '(?m)^[ \t]*version[ \t]*=[ \t]*"(?<v>[^"]+)"')
          if (-not $m.Success) { throw 'Could not parse [workspace.package].version from Cargo.toml' }
          $version = $m.Groups['v'].Value

          & $iscc 'installer\sh-images.iss' "/DAppVersion=$version"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          $setup = "target\installer\ShImages-Setup-$version-win-x64.exe"
          if (-not (Test-Path -LiteralPath $setup)) {
            throw "ISCC reported success but produced no installer at $setup"
          }
          "installer/sh-images.iss compiled cleanly for version $version"
