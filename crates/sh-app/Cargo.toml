[package]
name = "sh-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sh-core = { path = "../sh-core" }
gpui = "0.2.2"
image.workspace = true
anyhow = "1"
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
# rfd: native file dialogs; actively maintained (rfd 0.15.4), MIT license,
# no web dependencies. AsyncFileDialog runs on a dedicated thread, avoiding
# gpui entity-lease conflicts (AGENTS.md §7.2 justification).
rfd = "0.15"
# arboard: único clipboard cross-platform con imágenes en Rust puro, sin
# unsafe propio (verificado 3.6.1: set_image + ImageData RGBA); alternativa
# (winapi directo) = unsafe manual. Fijado a 3.x (AGENTS.md §7.2).
arboard = "3"
smallvec = "1"

[dev-dependencies]
# gpui test-support: headless window harness (TestAppContext, simulate_keystrokes)
# for keyboard-dispatch regression tests. Dev-only: not compiled into release
# builds, no runtime cost (AGENTS.md 7.2 justification).
gpui = { version = "0.2.2", features = ["test-support"] }
# tempfile: real temp dirs for open_folder tests. Already a workspace dep
# (used by sh-core); dev-only, no runtime cost.
tempfile.workspace = true

[target.'cfg(target_os = "windows")'.build-dependencies]
# embed-resource: compiles assets/branding/sh-images.rc so the sh-app executable
# carries the application icon. GPUI 0.2.2 loads the window-class icon from the
# executable module with `LoadImageW(GetModuleHandleW(None), MAKEINTRESOURCEW(1),
# IMAGE_ICON, ...)`, so the resource must be linked into the binary, not the
# library. Pinned to 3.0.11: already in the graph transitively (gpui's own
# build-dependency on the same crate), so this adds a direct edge to an audited
# build-time tool rather than a new dependency. MIT/Apache-2.0, build-time only,
# zero runtime code, and target-scoped so other platforms never compile it
# (AGENTS.md §7.2 justification).
embed-resource = "3.0.11"
