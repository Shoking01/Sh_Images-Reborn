[package]
name = "sh-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sh-core = { path = "../sh-core" }
gpui = "0.2.2"
image.workspace = true
anyhow = "1"
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
# rfd: native file dialogs; actively maintained (rfd 0.15.4), MIT license,
# no web dependencies. AsyncFileDialog runs on a dedicated thread, avoiding
# gpui entity-lease conflicts (AGENTS.md §7.2 justification).
rfd = "0.15"
# arboard: único clipboard cross-platform con imágenes en Rust puro, sin
# unsafe propio (verificado 3.6.1: set_image + ImageData RGBA); alternativa
# (winapi directo) = unsafe manual. Fijado a 3.x (AGENTS.md §7.2).
arboard = "3"
smallvec = "1"

[dev-dependencies]
# gpui test-support: headless window harness (TestAppContext, simulate_keystrokes)
# for keyboard-dispatch regression tests. Dev-only: not compiled into release
# builds, no runtime cost (AGENTS.md 7.2 justification).
gpui = { version = "0.2.2", features = ["test-support"] }
# tempfile: real temp dirs for open_folder tests. Already a workspace dep
# (used by sh-core); dev-only, no runtime cost.
tempfile.workspace = true
